<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:IT;font-weight:600;src:url(assets/inter-tight-latin-600-normal.woff2)}
@font-face{font-family:IT;font-weight:600;src:url(assets/inter-tight-greek-600-normal.woff2);unicode-range:U+0370-03FF,U+1F00-1FFF}
@font-face{font-family:ITG;font-weight:500;src:url(assets/inter-tight-greek-500-normal.woff2);unicode-range:U+0370-03FF,U+1F00-1FFF}
@font-face{font-family:PM;font-weight:500;src:url(assets/ibm-plex-mono-latin-500-normal.woff2)}
html,body{margin:0;background:#0A0E12}
.shot{position:relative;width:1080px;height:2160px;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,#18212A 0%,#0A0E12 70%);font-family:IT;color:#ECE8DF}
.cap{position:absolute;left:90px;right:90px;top:150px;font-weight:600;font-size:92px;line-height:1.04;letter-spacing:-.03em}
.sub{position:absolute;left:94px;right:90px;top:470px;font-family:PM,ITG;font-weight:500;font-size:28px;letter-spacing:.12em;text-transform:uppercase;color:#9AA5AE;line-height:1.5}
.ph{position:absolute;left:50%;top:640px;width:900px;transform:translateX(-50%);filter:drop-shadow(0 40px 80px rgba(0,0,0,.6))}
.mark{position:absolute;left:90px;top:84px}
.fg{position:relative;width:1024px;height:500px;overflow:hidden;background:#0A0E12;font-family:IT;color:#ECE8DF}
.rc{position:absolute;left:149px;top:958px;width:784px;min-height:118px;box-sizing:border-box;padding:18px 26px;display:flex;align-items:center;gap:22px;background:rgba(28,37,46,.94);border:2px solid rgba(236,232,223,.5);border-radius:26px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.rc .t{font-weight:600;font-size:32px;letter-spacing:-.015em;line-height:1.15;white-space:nowrap}
.rc .s{font-family:IT,ITG;font-weight:600;font-size:22px;color:#9AA5AE;margin-top:6px}
.rc .r{display:flex;flex-direction:column;align-items:flex-end;gap:12px;margin-left:auto}
.icon{width:512px;height:512px;background:#141B22;display:flex;align-items:center;justify-content:center}
</style></head><body><div id="root"></div>
<script>
const MARK = () => `<g transform="scale(2)"><line x1="84.00" y1="50.00" x2="90.00" y2="50.00" stroke="#E8E4DA" stroke-width="1.8"/><line x1="86.44" y1="56.42" x2="89.39" y2="56.95" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="84.77" y1="62.65" x2="87.59" y2="63.68" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="82.04" y1="68.50" x2="84.64" y2="70.00" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="78.34" y1="73.78" x2="80.64" y2="75.71" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="73.78" y1="78.34" x2="75.71" y2="80.64" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="68.50" y1="82.04" x2="70.00" y2="84.64" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="62.65" y1="84.77" x2="63.68" y2="87.59" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="56.42" y1="86.44" x2="56.95" y2="89.39" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="50.00" y1="84.00" x2="50.00" y2="90.00" stroke="#E8E4DA" stroke-width="1.8"/><line x1="43.58" y1="86.44" x2="43.05" y2="89.39" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="37.35" y1="84.77" x2="36.32" y2="87.59" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="31.50" y1="82.04" x2="30.00" y2="84.64" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="26.22" y1="78.34" x2="24.29" y2="80.64" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="21.66" y1="73.78" x2="19.36" y2="75.71" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="17.96" y1="68.50" x2="15.36" y2="70.00" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="15.23" y1="62.65" x2="12.41" y2="63.68" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="13.56" y1="56.42" x2="10.61" y2="56.95" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="16.00" y1="50.00" x2="10.00" y2="50.00" stroke="#E8E4DA" stroke-width="1.8"/><line x1="13.56" y1="43.58" x2="10.61" y2="43.05" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="15.23" y1="37.35" x2="12.41" y2="36.32" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="17.96" y1="31.50" x2="15.36" y2="30.00" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="21.66" y1="26.22" x2="19.36" y2="24.29" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="26.22" y1="21.66" x2="24.29" y2="19.36" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="31.50" y1="17.96" x2="30.00" y2="15.36" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="37.35" y1="15.23" x2="36.32" y2="12.41" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="43.58" y1="13.56" x2="43.05" y2="10.61" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="50.00" y1="16.00" x2="50.00" y2="10.00" stroke="#E8E4DA" stroke-width="1.8"/><line x1="56.42" y1="13.56" x2="56.95" y2="10.61" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="62.65" y1="15.23" x2="63.68" y2="12.41" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="68.50" y1="17.96" x2="70.00" y2="15.36" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="73.78" y1="21.66" x2="75.71" y2="19.36" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="78.34" y1="26.22" x2="80.64" y2="24.29" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="82.04" y1="31.50" x2="84.64" y2="30.00" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="84.77" y1="37.35" x2="87.59" y2="36.32" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><line x1="86.44" y1="43.58" x2="89.39" y2="43.05" stroke="rgba(232,228,218,.30)" stroke-width="1.2"/><path d="M48.800,24.000 A22.000,22.000 0 0 0 48.800,68.000 Z" fill="#E8E4DA"/><path d="M51.200,32.000 A22.000,22.000 0 0 1 51.200,76.000 Z" fill="#E4472F"/></g>`;
const T = {
  en: { ref: ['Every tilt.<br>Every product.', 'REF · VEL · SRV · CC · ZDR · raw Level II'],
        vel: ['See the rotation.', 'Velocity and storm-relative velocity'],
        cc: ['Debris and hail<br>stand out.', 'Dual-pol CC · US and German radars'],
        warn: ['Warnings the moment<br>they\'re issued.', 'NWS · MeteoAlarm · Storm Mode'],
        track: ['Storm tracks and<br>cross-sections.', 'Arrival times · hail risk · vertical slices'],
        fg: ['Professional weather radar.', 'Buy once. US and Europe.'],
        rain: ['Will it rain here?<br>Know when.', 'Next-hour rain forecast, with confidence'], card: ['Rain likely in 15–25 min', 'Your location · Medium confidence'] },
  el: { ref: ['Κάθε γωνία.<br>Κάθε προϊόν.', 'REF · VEL · SRV · CC · ZDR · Level II'],
        vel: ['Δείτε την<br>περιστροφή.', 'Ταχύτητα και ταχύτητα ως προς την καταιγίδα'],
        cc: ['Συντρίμμια και χαλάζι<br>ξεχωρίζουν.', 'Διπλή πόλωση CC · ραντάρ ΗΠΑ και Γερμανίας'],
        warn: ['Προειδοποιήσεις<br>τη στιγμή που εκδίδονται.', 'NWS · MeteoAlarm · Λειτουργία καταιγίδας'],
        track: ['Πορείες καταιγίδων<br>και κατακόρυφες τομές.', 'Ώρα άφιξης · κίνδυνος χαλαζιού · τομές'],
        fg: ['Επαγγελματικό ραντάρ καιρού.', 'Μία αγορά. ΗΠΑ και Ευρώπη.'],
        rain: ['Θα βρέξει εδώ;<br>Μάθετε πότε.', 'Βροχή της επόμενης ώρας, με βεβαιότητα'], card: ['Πιθανή βροχή σε 15–25 λεπτά', 'Η τοποθεσία σας · Μέτρια βεβαιότητα'] },
  de: { ref: ['Jede Elevation.<br>Jedes Produkt.', 'REF · VEL · SRV · CC · ZDR · Level II'],
        vel: ['Rotation<br>sichtbar machen.', 'Radialgeschwindigkeit, auch sturmrelativ'],
        cc: ['Trümmer und Hagel<br>stechen hervor.', 'Dual-Pol CC · Radare in USA und Deutschland'],
        warn: ['Warnungen, sobald<br>sie ausgegeben werden.', 'NWS · MeteoAlarm · Sturmmodus'],
        track: ['Zugbahnen und<br>Querschnitte.', 'Ankunftszeit · Hagelrisiko · Vertikalschnitte'],
        fg: ['Profi-Wetterradar.', 'Einmal kaufen. USA und Europa.'],
        rain: ['Regnet es hier?<br>Wissen, wann.', 'Regenvorhersage für die nächste Stunde'], card: ['Regen wahrscheinlich in 15–25 min', 'Dein Standort · Mittlere Sicherheit'] },
};
window.show = (mode, lang, key) => {
  const r = document.getElementById('root');
  if (mode === 'shot') {
    const [cap, sub] = T[lang][key];
    // The headline feature: the rain card the app shows over the map.
    let card = '';
    if (key === 'rain') {
      const [t, st] = T[lang].card;
      // Next hour, 5-min steps: dry, then light -> heavy -> easing (same colours as the app).
      const lv = [-1,-1,-1,-1,.12,.3,.5,.72,.9,.62,.4,.2,-1];
      const bw = 12, gap = 2.6, H = 52;
      const mix = k => { const a=[0x6F,0xB6,0xF0], b=[0x2A,0x63,0xD6]; return 'rgb(' + a.map((x,i)=>Math.round(x+(b[i]-x)*k)).join(',') + ')'; };
      let bars = '';
      lv.forEach((k, i) => {
        const x = i * (bw + gap);
        if (k < 0) bars += `<circle cx="${x + bw/2}" cy="${H-4}" r="2.6" fill="#3A4652"/>`;
        else { const h = H * (0.18 + 0.82 * k); bars += `<rect x="${x}" y="${H-2-h}" width="${bw}" height="${h}" rx="3" fill="${k > .8 ? '#E4472F' : mix(k)}"/>`; }
      });
      const meter = [1,1,0].map(f => `<div style="width:26px;height:7px;border-radius:4px;background:${f ? '#ECE8DF' : '#3A4652'}"></div>`).join('');
      card = `<div class="rc"><div><div class="t">${t}</div><div class="s">${st}</div></div>
        <div class="r"><svg width="178" height="${H}">${bars}</svg><div style="display:flex;gap:6px">${meter}</div></div></div>`;
    }
    r.innerHTML = `<div class="shot" lang="${lang}"><svg class="mark" viewBox="0 0 200 200" width="92" height="92" style="margin:-30px 0 0 -14px">${MARK()}</svg>
      <div class="cap">${cap}</div><div class="sub">${sub}</div><img class="ph" src="storeraw/${key === 'rain' ? 'ref' : key}.png">${card}</div>`;
  } else if (mode === 'fg') {
    const [a, b] = T[lang].fg;
    r.innerHTML = `<div class="fg" lang="${lang}"><img src="assets/stage_ref.png" style="position:absolute;left:300px;top:-200px;width:1250px;opacity:.95">
      <div style="position:absolute;inset:0;background:linear-gradient(90deg,#0A0E12 34%,rgba(10,14,18,.75) 52%,rgba(10,14,18,0) 75%)"></div><div style="position:absolute;inset:0;background:linear-gradient(0deg,#0A0E12 4%,rgba(10,14,18,0) 45%)"></div>
      <svg viewBox="0 0 200 200" width="92" height="92" style="position:absolute;left:60px;top:120px">${MARK()}</svg>
      <div style="position:absolute;left:170px;top:122px;font-weight:600;font-size:84px;letter-spacing:-.035em">Hookline</div>
      <div style="position:absolute;left:66px;top:260px;font-weight:600;font-size:34px;letter-spacing:-.01em">${a}</div>
      <div style="position:absolute;left:68px;top:312px;font-family:PM,ITG;font-weight:500;font-size:19px;letter-spacing:.12em;text-transform:uppercase;color:#9AA5AE">${b}</div></div>`;
  } else {
    r.innerHTML = `<div class="icon"><svg viewBox="0 0 200 200" width="330" height="330">${MARK()}</svg></div>`;
  }
  return Promise.all([...r.querySelectorAll('img')].map(i => i.complete ? 1 : new Promise(res => { i.onload = res; i.onerror = res; }))).then(() => document.fonts.ready);
};
</script></body></html>
