name: Android CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # post build errors as a commit comment

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: |
          set -o pipefail
          ./gradlew :core:radar:test :core:data:test :app:assembleDebug --continue 2>&1 | tee build.log

      - name: Lint (report only)
        run: ./gradlew :app:lintDebug
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: hookline-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      # Compile errors and failing tests go to a commit comment so they can be
      # read through the API without downloading logs.
      - name: Report failure on the commit
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Build failed'
            echo '```'
            grep -E '^e: |^w: .*(unresolved|type mismatch)|error:|FAILED|What went wrong|AssertionError|expected:<|Exception' build.log | head -150
            echo '```'
            echo '<details><summary>Last 80 lines</summary>'
            echo
            echo '```'
            tail -80 build.log
            echo '```'
            echo '</details>'
          } > report.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@report.md
