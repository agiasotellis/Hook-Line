name: Test release

# Push a tag like v0.2.0 to publish a downloadable APK on the Releases page.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :core:radar:test :core:data:test :app:assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "hookline-${GITHUB_REF_NAME}-debug.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Hookline ${{ github.ref_name }} (test build)
          prerelease: true
          files: hookline-*-debug.apk
          body: |
            Debug build for testing. Not for distribution.

            **Install:** open this page on your Android phone, tap the `.apk`, and allow your browser to install unknown apps when asked.

            If you installed an earlier test build and Android refuses to update, uninstall Hookline first: each CI build is signed with a fresh debug key.

            Live data needs a NEXRAD site that is currently scanning; if the feed can't be reached you'll see a labelled demo storm instead.
