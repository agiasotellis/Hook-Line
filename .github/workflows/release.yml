name: Test release

# Every push to main publishes a downloadable test APK on the Releases page,
# tagged v<versionName>-build<run number>. (Tags pushed by hand work too.)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Upload key (from repository secrets, if set)
        env:
          KS: ${{ secrets.HOOKLINE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "HOOKLINE_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "SIGNED=play" >> "$GITHUB_ENV"
          else
            echo "SIGNED=debugkey" >> "$GITHUB_ENV"
          fi

      - name: Build test APKs and the Play app bundle
        env:
          HOOKLINE_KEYSTORE_PASSWORD: ${{ secrets.HOOKLINE_KEYSTORE_PASSWORD }}
          HOOKLINE_KEY_ALIAS: ${{ secrets.HOOKLINE_KEY_ALIAS }}
          HOOKLINE_KEY_PASSWORD: ${{ secrets.HOOKLINE_KEY_PASSWORD }}
        run: ./gradlew :core:radar:test :core:data:test :app:assembleDebug :app:bundleRelease --stacktrace

      - name: Name the APK
        id: name
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
            TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          for f in app/build/outputs/apk/debug/app-*-debug.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.*)-debug\.apk$/\1/')
            cp "$f" "hookline-${TAG}-${abi}.apk"
          done
          ls -la hookline-*.apk
          # The .aab is what goes to Google Play (only usable when signed with the upload key).
          cp app/build/outputs/bundle/release/app-release.aab "hookline-${TAG}-${SIGNED}.aab"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.name.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Hookline ${{ steps.name.outputs.tag }} (test build)
          prerelease: true
          files: |
            hookline-*.apk
            hookline-*.aab
          body: |
            Debug build for testing, plus the Google Play app bundle (`.aab`).

            The bundle ending in `-play.aab` is signed with the upload key and can be uploaded to Play Console. One ending in `-debugkey.aab` means the signing secrets aren't set yet (see docs/PLAY-RELEASE.md).

            **Install:** open this page on your Android phone, tap the **arm64-v8a** `.apk` (right for almost every phone from the last eight years), and allow your browser to install unknown apps when asked. `armeabi-v7a` is for older 32-bit phones; `x86_64` is for emulators and Chromebooks.

            If you installed an earlier test build and Android refuses to update, uninstall Hookline first: each CI build is signed with a fresh debug key.

            Live data needs a NEXRAD site that is currently scanning; if the feed can't be reached you'll see a labelled demo storm instead.
