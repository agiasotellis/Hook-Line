name: Test release

# Every push to main publishes a downloadable test APK on the Releases page,
# tagged v<versionName>-build<run number>. (Tags pushed by hand work too.)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :core:radar:test :core:data:test :app:assembleDebug --stacktrace

      - name: Name the APK
        id: name
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
            TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/debug/app-debug.apk "hookline-${TAG}-debug.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.name.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Hookline ${{ steps.name.outputs.tag }} (test build)
          prerelease: true
          files: hookline-*-debug.apk
          body: |
            Debug build for testing. Not for distribution.

            **Install:** open this page on your Android phone, tap the `.apk`, and allow your browser to install unknown apps when asked.

            If you installed an earlier test build and Android refuses to update, uninstall Hookline first: each CI build is signed with a fresh debug key.

            Live data needs a NEXRAD site that is currently scanning; if the feed can't be reached you'll see a labelled demo storm instead.
